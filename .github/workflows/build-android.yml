# Builds an installable Android APK on Expo's servers (EAS Build).
# Run it from the Actions tab -> Build Android -> Run workflow. The run waits for Expo to finish
# (10-20 min, free tier may queue) and shows the result and APK link as annotations.
#
# Repository secret:   EXPO_TOKEN            expo.dev -> Account settings -> Access tokens
# The Supabase URL and anon key live in config/public.env. They are public by design
# (every installed app contains them); row-level security is what protects the data.
name: Build Android

on:
  # Also builds when native settings change (new Supabase key, app.json, native packages).
  # Pure JS changes are shipped by the Publish update workflow instead (no reinstall).
  push:
    branches: [main]
    paths: ['config/public.env', 'app.json', 'eas.json', 'package.json']
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = APK to install; development = dev client for live editing'
        default: preview
        type: choice
        options: [preview, development]

# Least privilege: the job only reads the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then echo "::error::Missing repository secret EXPO_TOKEN"; exit 1; fi
          if grep -q 'PASTE' config/public.env; then echo "::error::Fill in config/public.env"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Write app config for this build
        run: cp config/public.env .env
      - name: Link Expo project (creates it on first run)
        run: eas init --non-interactive --force
      - name: Start build
        # EAS_NO_VCS uploads the working folder (with .env), filtered by .easignore.
        env:
          EAS_NO_VCS: '1'
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive --wait --json > build.json
      - name: Report result
        if: always()
        run: |
          [ -s build.json ] || exit 0
          status=$(jq -r '.[0].status' build.json)
          echo "::notice::Expo build status=$status id=$(jq -r '.[0].id' build.json)"
          [ "$status" = "FINISHED" ] && echo "::notice::APK: $(jq -r '.[0].artifacts.buildUrl // .[0].artifacts.applicationArchiveUrl' build.json)" || true
          [ "$status" = "ERRORED" ] && echo "::error::$(jq -r '.[0].error.errorCode // ""' build.json): $(jq -r '.[0].error.message // ""' build.json | tr '\n' ' ' | cut -c1-900)" || true
