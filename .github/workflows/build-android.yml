# Builds an installable Android APK on Expo's servers (EAS Build).
# Run it from the Actions tab -> Build Android -> Run workflow. When the build finishes
# (10-20 min, free tier may queue), the APK download link is on expo.dev under Builds.
#
# Repository secret:   EXPO_TOKEN            expo.dev -> Account settings -> Access tokens
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SUPABASE_URL         https://<ref>.supabase.co
#   SUPABASE_ANON_KEY    Supabase -> Project Settings -> API -> anon public key
# The two Supabase values are public by design (every installed app contains them);
# row-level security on the database is what protects the data.
name: Build Android

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'preview = APK to install; development = dev client for live editing'
        default: preview
        type: choice
        options: [preview, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          missing=""
          [ -n "${{ secrets.EXPO_TOKEN }}" ] || missing="$missing EXPO_TOKEN(secret)"
          [ -n "${{ vars.SUPABASE_URL }}" ] || missing="$missing SUPABASE_URL(variable)"
          [ -n "${{ vars.SUPABASE_ANON_KEY }}" ] || missing="$missing SUPABASE_ANON_KEY(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Write app config for this build
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${{ vars.SUPABASE_URL }}" "${{ vars.SUPABASE_ANON_KEY }}" > .env
      - name: Link Expo project (creates it on first run)
        run: eas init --non-interactive --force
      - name: Start build
        # EAS_NO_VCS uploads the working folder (with .env), filtered by .easignore.
        env:
          EAS_NO_VCS: '1'
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
