# Applies the database migrations, deploys the Edge Functions and sets the Claude API key
# on Supabase. Runs on demand (Actions tab -> Run workflow) and whenever supabase/ changes.
#
# Repository secrets needed (Settings -> Secrets and variables -> Actions -> Secrets):
#   SUPABASE_ACCESS_TOKEN  supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the id in your project URL: https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD   the database password chosen when creating the project
#   ANTHROPIC_API_KEY      console.anthropic.com -> API keys
name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          missing=""
          for s in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do [ -n "${!s}" ] || missing="$missing $s"; done
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        run: supabase functions deploy summarize recommend --project-ref "$PROJECT_REF" --use-api
      - name: Set Claude API key
        run: supabase secrets set --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
