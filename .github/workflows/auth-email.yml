# Last run trigger: 2026-10-12 (2)
# Puts the 6-digit login code into Supabase's sign-up / login emails (the app logs in with the
# code; the default emails only carry a link, which opens localhost on a phone).
# Runs on demand and whenever this file changes.
#
# Repository secret needed: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)
name: Auth email setup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/auth-email.yml']

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'erfoqmoycgzdhijhhidq' }}
    steps:
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"
            exit 1
          fi
      - name: Set email templates
        run: |
          body='<h2>OURS</h2><p>인증 코드: <strong style="font-size:24px;letter-spacing:4px">{{ .Token }}</strong></p><p>앱에 이 6자리 숫자를 입력하세요.</p>'
          jq -n --arg b "$body" '{
            mailer_otp_length: 6,
            mailer_subjects_confirmation: "OURS 인증 코드",
            mailer_templates_confirmation_content: $b,
            mailer_subjects_magic_link: "OURS 인증 코드",
            mailer_templates_magic_link_content: $b
          }' > auth.json
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @auth.json)
          if [ "$code" != "200" ]; then
            echo "::error::Supabase API returned $code: $(head -c 300 resp.json)"
            exit 1
          fi
          echo "::notice::Email templates updated (otp length $(jq -r .mailer_otp_length resp.json))"
